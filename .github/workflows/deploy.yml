name: CD - Deploy to self-hosted runner

# CI가 main push로 성공하면, 내 PC(Self-hosted Runner)가 새 이미지를 받아 무중단 교체한다.
on:
  workflow_run:
    workflows: ["CI - Build & Push Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, linux, universe]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/universe
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      URL: http://127.0.0.1:8090
    steps:
      - name: Check out deploy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start monitoring (before deploy)
        run: |
          mkdir -p verify
          echo before > verify/phase
          nohup python3 deploy/monitor.py run --url "$URL" --out verify/requests.csv --phase-file verify/phase > verify/monitor.log 2>&1 &
          sleep 5

      - name: Pull latest image & replace running container
        run: |
          set -o pipefail
          echo during > verify/phase
          bash deploy/deploy.sh "$IMAGE:$SHA" "${SHA::7}" 2>&1 | tee verify/deploy.log
          echo after > verify/phase

      - name: Keep monitoring 30 s after deploy
        if: always()
        run: |
          echo after > verify/phase
          sleep 30
          echo stop > verify/phase
          sleep 3

      - name: Write verification summary
        if: always()
        run: |
          python3 deploy/monitor.py summarize --csv verify/requests.csv --url "$URL" --image "universe:${SHA::7}" | tee verify/summary.md
          cat verify/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verification
          path: verify/

# 고정 진입점(127.0.0.1:8090) → 현재 활성 컨테이너(blue 또는 green)
# 활성 대상은 active.conf에 있고, 배포 때 교체 후 nginx -s reload(무중단)
include /etc/nginx/universe/active.conf;

server {
  listen 80;
  location / {
    proxy_pass http://universe_app;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}

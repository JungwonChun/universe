server {
  listen 80;
  root /usr/share/nginx/html;

  # 컨테이너 상태 확인용 (Docker HEALTHCHECK, 배포 스크립트)
  location = /healthz { access_log off; return 200 "ok\n"; }

  # 배포 버전 확인용, 캐시 금지
  location = /version.json { add_header Cache-Control "no-store"; }

  # 서비스 워커·HTML은 항상 새로 받아야 새 버전 배너가 뜬다
  location ~* (sw\.js|workbox-.*\.js|index\.html)$ { add_header Cache-Control "no-cache"; }

  # 해시가 붙은 빌드 결과물은 오래 캐시
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # SPA: 없는 경로는 index.html로
  location / { try_files $uri $uri/ /index.html; }
}
